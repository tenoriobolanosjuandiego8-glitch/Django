{% load static %}
<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Crear cuenta · URBIX</title>
  <link rel="stylesheet" href="{% static 'usuarios/app.css' %}">
</head>
<body class="registro">
  <div class="escena" aria-hidden="true">
    <div class="calle"></div>
    <div class="auto"></div><div class="auto"></div><div class="auto"></div>
  </div>

  <main class="tarjeta tarjeta--registro">
    <div class="marca"><span>U</span>URBIX</div>
    <h1>Crear una cuenta</h1>
    <p class="sub">Completa tus datos para comenzar.</p>

    <form id="formRegistro" novalidate>
      <div class="form-grid">
        <div class="form-group">
          <label for="username">Usuario</label>
          <input id="username" type="text" autocomplete="username" placeholder="aprendiz1" required>
        </div>
        <div class="form-group">
          <label for="email">Correo</label>
          <input id="email" type="email" autocomplete="email" placeholder="tu@correo.com" required>
        </div>
        <div class="form-group campo-completo">
          <label for="identificacion">Identificación</label>
          <input id="identificacion" type="text" inputmode="numeric" autocomplete="off" placeholder="Número de documento" required>
        </div>
        <div class="form-group campo-completo">
          <label for="telefono">Teléfono <span>(opcional)</span></label>
          <input id="telefono" type="tel" inputmode="tel" autocomplete="tel" placeholder="3001234567">
        </div>
        <div class="form-group">
          <label for="password">Contraseña</label>
          <input id="password" type="password" autocomplete="new-password" required>
        </div>
        <div class="form-group">
          <label for="password2">Confirmar contraseña</label>
          <input id="password2" type="password" autocomplete="new-password" required>
        </div>
      </div>

      <p class="ayuda">Usa una contraseña segura que no sea común ni solo numérica.</p>
      <button id="btnRegistrar" type="submit">Crear cuenta</button>
      <div id="mensaje" class="mensaje" role="status" aria-live="polite"></div>
    </form>

    <p class="registro-footer">¿Ya tienes cuenta? <a href="/">Iniciar sesión</a></p>
  </main>

  <script src="{% static 'usuarios/app.js' %}"></script>
</body>
</html>
